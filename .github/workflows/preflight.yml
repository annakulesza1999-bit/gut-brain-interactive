name: Gut and Mind preflight
on:
  push:
    branches:
      - design/academic-minimalism
      - security/dependency-remediation
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate candidate lockfile (remediation branch only)
        if: github.ref == 'refs/heads/security/dependency-remediation'
        run: |
          cp package-lock.json /tmp/previous-lock.json
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          node scripts/report-lock-delta.mjs /tmp/previous-lock.json package-lock.json
      - name: Install locked dependencies without lifecycle scripts
        id: install
        run: npm ci --ignore-scripts
      - name: Unit tests
        run: node --test test_activities.js test_anatomy_activities.js test_presentations.js test_research_activities.js test_simulations.js test_spatial_activities.js
      - name: Prepare pinned anatomical model
        run: npm run prepare:atlas
      - name: Build frontend
        run: npm run build
      - name: Real 15-client loopback smoke test
        run: node --test test_session_smoke.js
      - name: Dependency audit
        if: ${{ always() && steps.install.outcome == 'success' }}
        run: npm audit --audit-level=low
